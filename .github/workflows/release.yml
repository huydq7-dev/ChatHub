name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/validate-release.py --tag "$RELEASE_TAG"

      - name: Run Web & Swift Tests
        run: |
          python3 scripts/test-release.py
          node --test scripts/test-web.mjs scripts/test-notifications.mjs
          bash scripts/test.sh

      - name: Build and Package DMG & ZIP
        run: bash scripts/package.sh

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ChatHub-macOS.dmg
            dist/ChatHub-macOS.zip
          generate_release_notes: true
